# External links rot without any commit, so they are checked on a schedule
# instead of on every pull request (where a third-party outage would block
# unrelated work). Pull requests that change the links themselves are checked too.
name: Links

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/links.yml
      - README.md
      - src/data/**
      - src/routes/**

permissions:
  contents: read

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with 999 and Google Forms needs a browser session.
          # The site's own URLs (src/lib/site.ts) are left out: they only resolve
          # after a deploy, and check:dist already verifies those files exist.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200..=299,429
            --exclude '^https://www\.linkedin\.com/'
            --exclude '^https://docs\.google\.com/forms/'
            --exclude '^http://localhost'
            README.md 'src/data/**/*.ts' 'src/routes/**/*.tsx'
          fail: true
